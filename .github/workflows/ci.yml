name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + ruff + unit files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TLP runs its battery plugins with /bin/sh; dash is the strictest common target and,
      # like TLP itself, allows `local`.
      - name: shellcheck
        run: shellcheck -s dash tlp/bat.d/65-tuxedo-uniwill tests/plugin-test.sh
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: >
          uvx ruff check --config ruff.toml
          tcc-sync/tuxedo-tlp-controld-sync tcc-sync/tuxedo-tlp-tcc-sync tests/controld_sync_test.py
      # systemd-analyze checks that ExecStart= exists and that ordered units load, so install
      # the scripts and stub the services they order after (not installed on the runner).
      - name: systemd-analyze verify
        run: |
          sudo install -m755 tcc-sync/tuxedo-tlp-controld-sync tcc-sync/tuxedo-tlp-tcc-sync /usr/bin/
          stubs=$(mktemp -d)
          for u in tuxedo-control tccd tlp tlp-pd; do
            printf '[Service]\nExecStart=/bin/true\n' > "$stubs/$u.service"
          done
          # The trailing colon keeps the default unit search path after the stubs.
          SYSTEMD_UNIT_PATH="$stubs:" systemd-analyze verify \
            tcc-sync/tuxedo-tlp-controld-sync.service tcc-sync/tuxedo-tlp-tcc-sync.service

  sync:
    name: controld sync (fake tlp-pd + controld)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: controld sync tests
        run: python3 -I tests/controld_sync_test.py

  arch:
    name: plugin tests on TLP + PKGBUILD (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install TLP, dash, namcap
        run: pacman -Syu --noconfirm --needed tlp dash namcap git
      - uses: actions/checkout@v4
      # The plugin runs against TLP's real helper functions from the packaged tlp-func-base.
      - name: plugin tests (dash)
        run: dash tests/plugin-test.sh
      - name: plugin tests (bash)
        run: bash tests/plugin-test.sh
      # makepkg refuses to run as root.
      - name: .SRCINFO matches PKGBUILD
        run: |
          useradd -m builder
          cp -r aur /home/builder/aur && chown -R builder /home/builder/aur
          su builder -c 'cd ~/aur && makepkg --printsrcinfo' | diff -u aur/.SRCINFO -
      # namcap exits 0 even with findings, so fail on any output.
      - name: namcap
        run: |
          out=$(namcap aur/PKGBUILD)
          [ -z "$out" ] || { echo "$out"; exit 1; }
