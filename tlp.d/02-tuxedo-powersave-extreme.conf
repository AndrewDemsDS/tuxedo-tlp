# TLP power-saver profile mirroring TUXEDO Control Center's "Powersave extreme":
# CPU capped at its lowest frequency. Fans and brightness follow via
# tuxedo-tlp-tcc-sync, which switches TCC to that profile while TLP is in
# power-saver. TCC's own CPU control must be off (cpuSettingsEnabled=false in
# /etc/tcc/settings, or Settings > CPU settings in the TCC GUI) or it fights TLP.
#
# Frequencies are for the Ryzen 7 8845HS (cpuinfo_min_freq / amd_pstate_max_freq).
# Check yours with:
#   cat /sys/devices/system/cpu/cpu0/cpufreq/{cpuinfo_min_freq,amd_pstate_max_freq}
CPU_SCALING_MIN_FREQ_ON_SAV=416548
CPU_SCALING_MAX_FREQ_ON_SAV=416548
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_SAV=0

# Undo the cap when leaving power-saver: TLP leaves unset limits untouched.
CPU_SCALING_MIN_FREQ_ON_AC=416548
CPU_SCALING_MAX_FREQ_ON_AC=5102713
CPU_SCALING_MIN_FREQ_ON_BAT=416548
CPU_SCALING_MAX_FREQ_ON_BAT=5102713
